[package]
name = "openmatl-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "openmatl_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "om"
path = "src/main.rs"

[dependencies]
arrow = { version = "59.2.0", features = ["csv"] }
pest = "2.9.0"
pest_derive = "2.9.0"
textplots = "0.8.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
arrow = { version = "59.2.0", features = ["pyarrow"] }
rustyline = "18.0.1"
rayon = "1.10.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
